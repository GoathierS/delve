[workspace]
resolver = "3"
members = ["crates/core", "crates/term", "crates/gui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Gauthier Souquet"]
repository = "https://github.com/GoathierS/delve"
homepage = "https://github.com/GoathierS/delve"

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
